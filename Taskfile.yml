version: '3'

tasks:
  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...
  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...
  test:
    desc: Run the tests
    cmds:
      - go test ./...
  check:
    desc: fmt, vet, test
    cmds:
      - task: fmt
      - task: vet
      - task: test
  deps:tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy
  serve:
    desc: Run the web UI on http://localhost:8080
    cmds:
      - go run ./cmd/bytestone-scan serve {{.CLI_ARGS}}
  diagrams:
    desc: Draw each workflow definition as internal/web/diagrams/<type>.svg (needs d2)
    cmds:
      - go run ./internal/web/diagrams/gen
  docs:build:
    desc: Render the project docs into docs/
    cmds:
      - task-plus md2html --file index.md --dst docs
  clean:
    desc: Remove build output
    cmds:
      - rm -f bytestone-scan docs/*.html
